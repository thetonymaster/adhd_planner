[project]
name = "planner-setup"
version = "0.1.0"
description = "Set up the adhd-planner marketplace for Claude Code and Cowork."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["questionary>=2.0"]

[project.scripts]
planner-setup = "planner_setup.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner_setup"]

# examples/ and docs/setup.md live outside setup/: hatch_build.py adds them to
# the wheel, and the sdist carries copies so a wheel can be built from it.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.force-include]
"../examples" = "src/planner_setup/examples"
"../docs/setup.md" = "src/planner_setup/examples/setup.md"
